name: Build Android APK

# Builds the In the Midst Android app (Capacitor shell around the web app)
# and uploads the debug APK as an artifact. No signing secrets needed:
# assembleDebug is debug-signed automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Android project
        run: |
          npx cap init "In the Midst" com.inthemidst.app --web-dir=public
          npx cap add android

      - name: Point the app at the live server
        run: |
          cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.inthemidst.app',
            appName: 'In the Midst',
            webDir: 'public',
            server: {
              url: 'https://in-the-midst.onrender.com',
              cleartext: false,
            },
          };

          export default config;
          EOF
          cat capacitor.config.ts

      - name: Add camera and microphone permissions
        run: |
          python3 - << 'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              text = f.read()
          for perm in ('CAMERA', 'RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS', 'ACCESS_NETWORK_STATE'):
              line = f'    <uses-permission android:name="android.permission.{perm}" />'
              if perm not in text:
                  text = text.replace('</manifest>', line + '\n</manifest>')
          with open(path, 'w') as f:
              f.write(text)
          print(open(path).read())
          EOF

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: in-the-midst-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
