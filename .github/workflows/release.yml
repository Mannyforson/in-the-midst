name: Build Android release bundle

# Builds the In the Midst Android app (Capacitor shell around the web app)
# as a signed release bundle (.aab) for Google Play. Signing uses the
# upload keystore stored in GitHub secrets. This workflow only builds and
# uploads the .aab as an artifact; uploading to Play is a separate step.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Create Android project
        run: |
          npx cap init "In the Midst" com.inthemidst.app --web-dir=public
          npx cap add android
      - name: Point the app at the live server
        run: |
          cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.inthemidst.app',
            appName: 'In the Midst',
            webDir: 'public',
            server: {
              url: 'https://in-the-midst.onrender.com',
              cleartext: false,
            },
          };
          export default config;
          EOF
          cat capacitor.config.ts
      - name: Add camera and microphone permissions
        run: |
          python3 - << 'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path) as f:
              text = f.read()
          for perm in ('CAMERA', 'RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS', 'ACCESS_NETWORK_STATE'):
              line = f'    <uses-permission android:name="android.permission.{perm}" />'
              if perm not in text:
                  text = text.replace('</manifest>', line + '\n</manifest>')
          with open(path, 'w') as f:
              f.write(text)
          print(open(path).read())
          EOF
      - name: Resolve duplicate Kotlin stdlib
        run: |
          python3 - << 'EOF'
          path = 'android/app/build.gradle'
          with open(path) as f:
              text = f.read()
          block = '''
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
              }
          }
          '''
          if 'kotlin-stdlib-jdk8' not in text:
              with open(path, 'a') as f:
                  f.write(block)
          print(open(path).read()[-600:])
          EOF
      - name: Generate launcher icons
        run: |
          npm install @capacitor/assets
          npx @capacitor/assets generate --android
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-key.p12
          ls -la android/app/upload-key.p12
      - name: Build release bundle
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=app/upload-key.p12 \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          ls -la app/build/outputs/bundle/release/app-release.aab
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: in-the-midst-android-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
